name: Sync Sources

on:
  push:
    branches: [main]
    paths:
      - eggtv_sync.json
      - tools/eggtv_sync.py
      - tools/eggtv_speedtest.py
      - tools/eggtv_search.py
      - tools/eggtv_publish.py
      - tools/verify_published.py
      - tools/playback_policy.py
      - tests/**
      - .github/workflows/sync-sources.yml
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile name, for example tvbox or jsm. Leave empty to sync all."
        required: false
        type: string
      upstream_url:
        description: "Optional temporary upstream URL override."
        required: false
        type: string
  schedule:
    - cron: "13 */6 * * *"

concurrency:
  group: eggtv-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify sync protections
        run: python3 -m unittest discover -s tests -v

      - name: Sync sources
        id: sync
        continue-on-error: true
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_UPSTREAM_URL: ${{ inputs.upstream_url }}
        run: |
          set -eu
          if [ -n "${INPUT_PROFILE:-}" ]; then
            if [ -n "${INPUT_UPSTREAM_URL:-}" ]; then
              python3 tools/eggtv_sync.py --no-proxy sync "$INPUT_PROFILE" --upstream-url "$INPUT_UPSTREAM_URL"
            else
              python3 tools/eggtv_sync.py --no-proxy sync "$INPUT_PROFILE"
            fi
          else
            python3 tools/eggtv_sync.py --no-proxy sync --all
          fi

      - name: Validate prepared configuration files
        run: python3 tools/verify_published.py --local-only

      - name: Commit changes
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/eggtv_publish.py

      - name: Verify original subscriptions after publication
        run: python3 tools/verify_published.py --timeout 300 --interval 10

      - name: Measure published source response speed
        id: speed
        run: python3 tools/eggtv_sync.py --no-proxy speedtest --location "GitHub 云端（仅供参考）"

      - name: Save response report
        if: ${{ always() && (steps.speed.outcome == 'success' || steps.speed.outcome == 'failure') }}
        run: |
          python3 tools/eggtv_publish.py --message "chore(health): refresh published source checks"

      - name: Report upstream synchronization failure
        if: ${{ always() && steps.sync.outcome == 'failure' }}
        run: |
          echo "Some sources could not be updated; failed profiles kept their previous configuration. See sync_report.json and the publication steps for the status of successful profiles."
          exit 1

      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-reports
          path: |
            sync_report.json
            search_health_*.json
            speed_report.json
            publication_report.json
          if-no-files-found: ignore
