name: Publish Eggshell App Feed
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Sync Sources]
    types: [completed]
  push:
    branches: [main]
    paths: [tools/publish_app_feed.py, .github/workflows/publish-app-feed.yml]
concurrency:
  group: eggtv-app-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test app feed publisher
        run: python3 -m unittest discover -s tests -p test_app_feed.py -v
      - name: Publish the independent app feed
        run: python3 tools/publish_app_feed.py
      - name: Commit only app feed files
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(app): refresh independent Eggshell catalogue'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
